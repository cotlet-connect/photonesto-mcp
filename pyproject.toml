[project]
name = "photonesto-mcp"
version = "1.1.0"
description = "Connect Photonesto to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Photonesto API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["photonesto", "photonesto api", "photonesto mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/photonesto-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=photonesto"
Source = "https://github.com/cotlet-connect/photonesto-mcp"

[project.scripts]
photonesto-mcp = "photonesto_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"photonesto_agent.py" = "photonesto_agent.py"

[tool.hatch.build.targets.sdist]
include = ["photonesto_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
